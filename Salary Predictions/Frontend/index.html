<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Salary Predictor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
            position:relative;
        }

        /* Animated Background */

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(80px);
            animation:float 8s infinite ease-in-out;
        }

        .circle1{
            width:300px;
            height:300px;
            background:#7c3aed;
            top:-80px;
            left:-80px;
        }

        .circle2{
            width:250px;
            height:250px;
            background:#06b6d4;
            bottom:-60px;
            right:-60px;
            animation-delay:2s;
        }

        .circle3{
            width:180px;
            height:180px;
            background:#ec4899;
            top:50%;
            left:65%;
            animation-delay:4s;
        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(30px);
            }

            100%{
                transform:translateY(0px);
            }

        }

        /* Main Card */

        .container{
            width:420px;
            padding:45px;
            border-radius:30px;
            backdrop-filter:blur(18px);
            background:rgba(255,255,255,0.1);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 15px 40px rgba(0,0,0,0.4);
            text-align:center;
            color:white;
            z-index:10;
            animation:cardAnimation 1s ease;
        }

        @keyframes cardAnimation{

            from{
                opacity:0;
                transform:translateY(50px);
            }

            to{
                opacity:1;
                transform:translateY(0px);
            }

        }

        .logo{
            width:90px;
            height:90px;
            margin:auto;
            margin-bottom:20px;
            border-radius:50%;
            background:linear-gradient(135deg,#8b5cf6,#06b6d4);
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:38px;
            font-weight:bold;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h1{
            font-size:34px;
            margin-bottom:10px;
            font-weight:700;
        }

        .subtitle{
            font-size:15px;
            color:#d1d5db;
            margin-bottom:35px;
        }

        .input-box{
            position:relative;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:18px;
            border:none;
            outline:none;
            border-radius:15px;
            background:rgba(255,255,255,0.15);
            color:white;
            font-size:18px;
            border:1px solid rgba(255,255,255,0.2);
            transition:0.3s;
        }

        input::placeholder{
            color:#d1d5db;
        }

        input:focus{
            border:1px solid #8b5cf6;
            box-shadow:0 0 20px rgba(139,92,246,0.6);
            transform:scale(1.02);
        }

        button{
            width:100%;
            padding:18px;
            border:none;
            border-radius:15px;
            background:linear-gradient(135deg,#8b5cf6,#06b6d4);
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.4s;
            box-shadow:0 10px 20px rgba(0,0,0,0.3);
        }

        button:hover{
            transform:translateY(-3px) scale(1.02);
            box-shadow:0 15px 30px rgba(0,0,0,0.4);
        }

        .loading{
            margin-top:20px;
            display:none;
            font-size:18px;
            color:#facc15;
            font-weight:600;
        }

        .result-box{
            margin-top:30px;
            padding:25px;
            border-radius:20px;
            background:rgba(255,255,255,0.12);
            border:1px solid rgba(255,255,255,0.2);
            display:none;
            animation:fadeIn 0.5s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0px);
            }

        }

        .result-title{
            font-size:18px;
            color:#d1d5db;
        }

        .salary{
            margin-top:12px;
            font-size:40px;
            font-weight:700;
            background:linear-gradient(135deg,#facc15,#22c55e);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .footer{
            margin-top:25px;
            font-size:13px;
            color:#cbd5e1;
        }

    </style>
</head>

<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="container">

        <div class="logo">
            AI
        </div>

        <h1>Salary Predictor</h1>

        <p class="subtitle">
            Predict your future salary with AI & Machine Learning
        </p>

        <div class="input-box">

            <input 
                type="number" 
                id="exp"
                placeholder="Enter Years of Experience"
            >

        </div>

        <button onclick="predictSalary()">
            Predict Salary
        </button>

        <div class="loading" id="loading">
            Predicting Salary...
        </div>

        <div class="result-box" id="resultBox">

            <div class="result-title">
                Estimated Salary
            </div>

            <div class="salary" id="result">
                ₹ 0
            </div>

        </div>

        <div class="footer">
            Powered by Smit Mevada
        </div>

    </div>

    <script>

        async function predictSalary(){

            let exp = document.getElementById("exp").value;

            let loading = document.getElementById("loading");

            let resultBox = document.getElementById("resultBox");

            let result = document.getElementById("result");

            if(exp === ""){

                alert("Please Enter Experience");

                return;
            }

            loading.style.display = "block";

            resultBox.style.display = "none";

            try{

                let response = await fetch("http://127.0.0.1:8000/predict",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        YearsExperience:Number(exp)
                    })

                });

                let data = await response.json();

                loading.style.display = "none";

                resultBox.style.display = "block";

                result.innerHTML = "₹ " + data.PredictedSalary.toFixed(2);

            }

            catch(error){

                loading.style.display = "none";

                alert("API Connection Error");

                console.log(error);

            }

        }

    </script>

</body>
</html>
