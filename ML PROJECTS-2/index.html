<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000, #111827, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(24, 24, 27, 0.9);
            border: 1px solid #27272a;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            color: #a1a1aa;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d4d4d8;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: #0f0f0f;
            color: white;
            border: 1px solid #3f3f46;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background: white;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.02);
        }

        .result {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .prediction-box {
            width: 100%;
            padding: 40px;
            border-radius: 25px;
            margin-top: 20px;
        }

        .high {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
        }

        .low {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
        }

        .prediction-value {
            font-size: 70px;
            font-weight: bold;
            margin-top: 15px;
        }

        @media(max-width:900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <div class="card">

            <h1>Sales Prediction</h1>

            <p>
                Predict product sales using Machine Learning Logistic Regression.
            </p>

            <div class="input-box">
                <label>Category</label>
                <input type="number" id="category" placeholder="Enter category">
            </div>

            <div class="input-box">
                <label>Price</label>
                <input type="number" id="price" placeholder="Enter price">
            </div>

            <div class="input-box">
                <label>Stock</label>
                <input type="number" id="stock" placeholder="Enter stock">
            </div>

            <button onclick="predictSales()">
                Predict Sales
            </button>

        </div>

        <!-- Right Side -->
        <div class="card result">

            <h1>Prediction Result</h1>

            <div id="resultBox">
                <p>
                    Enter details and predict sales.
                </p>
            </div>

        </div>

    </div>

    <script>

        async function predictSales() {

            const category = document.getElementById("category").value;
            const price = document.getElementById("price").value;
            const stock = document.getElementById("stock").value;

            const response = await fetch("http://127.0.0.1:8000/predict ", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    category: Number(category),
                    price: Number(price),
                    stock: Number(stock)
                })
            });

            const data = await response.json();

            const prediction = data.prediction || data.sales;

            const resultBox = document.getElementById("resultBox");

            if (prediction == 1) {

                resultBox.innerHTML = `
        
          <div class="prediction-box high">

            <h2>High Sales Prediction 🚀</h2>

            <div class="prediction-value">
              ${prediction}
            </div>

          </div>

        `;

            }

            else {

                resultBox.innerHTML = `
        
          <div class="prediction-box low">

            <h2>Low Sales Prediction 📉</h2>

            <div class="prediction-value">
              ${prediction}
            </div>

          </div>

        `;
            }

        }

    </script>

</body>

</html>
